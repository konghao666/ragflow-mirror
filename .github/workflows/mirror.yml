name: Mirror RAGFlow Images (GHCR + ACR)

on:
  workflow_dispatch:
    inputs:
      ragflow_version:
        description: 'RAGFlow version (e.g. v0.26.0, nightly)'
        required: true
        default: 'v0.26.0'
      mysql_version:
        description: 'MySQL version'
        required: true
        default: '8.0.39'
      es_version:
        description: 'Elasticsearch version'
        required: true
        default: '8.11.3'
      minio_tag:
        description: 'MinIO full tag (e.g. pgsty/minio:RELEASE.2026-03-25T00-00-00Z)'
        required: true
        default: 'pgsty/minio:RELEASE.2026-03-25T00-00-00Z'
      valkey_version:
        description: 'Valkey version'
        required: true
        default: '8'
      infinity_version:
        description: 'Infinity version (e.g. v0.7.0)'
        required: true
        default: 'v0.7.0'
      alpine_version:
        description: 'Alpine version (e.g. 3.21)'
        required: true
        default: '3.21'

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - full: "infiniflow/ragflow:${{ github.event.inputs.ragflow_version }}"
          - full: "mysql:${{ github.event.inputs.mysql_version }}"
          - full: "elasticsearch:${{ github.event.inputs.es_version }}"
          - full: "${{ github.event.inputs.minio_tag }}"
          - full: "valkey/valkey:${{ github.event.inputs.valkey_version }}"
          - full: "infiniflow/infinity:${{ github.event.inputs.infinity_version }}"
          - full: "alpine:${{ github.event.inputs.alpine_version }}"

    steps:
      - name: Pull image
        run: docker pull ${{ matrix.image.full }}

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ matrix.image.full }} ghcr.io/konghao666/ragflow-mirror/${{ matrix.image.full }}
          docker push ghcr.io/konghao666/ragflow-mirror/${{ matrix.image.full }}

      - name: Push to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login crpi-mhhhjbf3r2akhaj7.cn-chengdu.personal.cr.aliyuncs.com -u ${{ secrets.ACR_USERNAME }} --password-stdin
          # ACR does not allow slashes in image names, replace / with _
          ACR_NAME=$(echo "${{ matrix.image.full }}" | sed 's|/|_|g')
          docker tag ${{ matrix.image.full }} crpi-mhhhjbf3r2akhaj7.cn-chengdu.personal.cr.aliyuncs.com/ragflow-mirror-7sad/$ACR_NAME
          docker push crpi-mhhhjbf3r2akhaj7.cn-chengdu.personal.cr.aliyuncs.com/ragflow-mirror-7sad/$ACR_NAME
